name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Vet for Windows
        if: runner.os == 'Linux'
        run: GOOS=windows go vet ./...
      - name: Test
        run: go test -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe でバージョンを決めるため
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build release files
        run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: host-shell-${{ github.sha }}
          path: dist/release/
          retention-days: 14
