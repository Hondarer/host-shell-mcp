name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux と Windows は接続先、macOS は手元 (host-shell bridge) として使う。
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Vet for other OSes
        if: runner.os == 'Linux'
        run: |
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...
      # 結果、飛ばしたテスト、テストのログだけを表示する。bash は pipefail で動くため、失敗は検出される。
      - name: Test
        run: go test -count=1 -v ./... 2>&1 | grep -E '^(---|ok|FAIL|PASS|panic)|_test\.go'
        shell: bash

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe でバージョンを決めるため
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build release files
        run: make release
      - uses: actions/upload-artifact@v7
        with:
          name: host-shell-${{ github.sha }}
          path: dist/release/
          retention-days: 14
