name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows are tested as targets, macOS as the local side (host-shell bridge).
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Vet for other OSes
        if: runner.os == 'Linux'
        run: |
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...
      # Show only results, skipped tests and test logs. bash runs with pipefail, so failures are still detected.
      - name: Test
        run: go test -count=1 -v ./... 2>&1 | grep -E '^(---|ok|FAIL|PASS|panic)|_test\.go'
        shell: bash
      # sudo_run with a password needs a user whose sudo asks for one; the runner user's does not.
      - name: Test sudo with a password
        if: runner.os == 'Linux'
        run: |
          sudo useradd -m hstest
          echo 'hstest:Hs-Test-Pass-1' | sudo chpasswd
          echo 'hstest ALL=(ALL) ALL' | sudo tee /etc/sudoers.d/hstest > /dev/null
          go test -c -o /tmp/server.test ./internal/server
          chmod 755 /tmp/server.test
          cd /tmp && sudo -u hstest env HOST_SHELL_TEST_SUDO_PASSWORD=Hs-Test-Pass-1 ./server.test -test.run 'TestSudoPassword$' -test.v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe determines the version
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build release files
        run: make release
      - uses: actions/upload-artifact@v7
        with:
          name: host-shell-${{ github.sha }}
          path: dist/release/
          retention-days: 14
