name: Release

# When a Release is published, build at its tag and attach the source archives with dist/ and the
# skill's bin/ (zip and tar.gz, laid out like GitHub's own source archives) to the Release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -count=1 ./...
      - name: Build release files
        run: make release VERSION="$TAG"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/release/* --clobber
