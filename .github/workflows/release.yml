name: Release

# Build the tagged revision and upload source+binary archives
# (zip and tar.gz matching GitHub's source archive layout, including dist/ and skill bin/).
# Runs when a release is published or edited, and when an existing tag is moved.
# A moved tag is a push whose before and after SHAs are both real commits.
# GitHub leaves `forced` false for tag updates, so do not use it.
# Creating a tag (before is all zeros) is left to the published event so a new
# release is not built twice. Deleting a tag (after is all zeros) does not build.
# Assets from an older archive name are removed after upload.
on:
  release:
    types: [published, edited]
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'release' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.after != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -count=1 ./...
      - name: Build release files
        run: make release VERSION="$TAG"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          shopt -s nullglob
          files=(dist/release/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no archives in dist/release" >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
          keep=" $(printf '%s ' "${files[@]##*/}")"
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            case "$name" in
              host-shell-mcp-*-bin.zip|host-shell-mcp-*-bin.tar.gz)
                case "$keep" in
                  *" $name "*) ;;
                  *) gh release delete-asset "$TAG" "$name" --yes ;;
                esac
                ;;
            esac
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
